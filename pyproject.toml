[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srcg-torch"
version = "0.1.0"
description = "PyTorch-side batch reservation and cooperative checkpoint client for SRCG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["torch>=2.13"]

[tool.setuptools.packages.find]
include = ["srcg_torch*"]
